<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body {
            height: 100%;
        }
        .pervaia {
            background-color: rgb(181, 227, 201);
            min-height: 100vh;
        }
        header {
            color: #204d3a;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
            
        }
        a {
            color: #204d3a;
            text-decoration: none;
            font-size: 20px;
            font-family:Arial, Helvetica, sans-serif;

        }
        .con {
            display: flex;
            justify-content: space-around;
            flex-direction: row;
            gap: 20px;
            font-family: Poppins;
        }
        button {
            background-color: rgb(181, 227, 201);
            color: #204d3a;
            border-color: #204d3a;
            border-width: 2px;
            width: 110px;
            height: 50px;
            font-weight: bold;
        }
        .logo{
            font-size: 40px;
            font-weight: bold;
            font-family: Elephant-Regular;
        }
        .kl{
            display:flex ;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
        }
        .gtext {
            font-size: 80px;
            display: flex;
            flex-wrap: wrap-reverse;
            padding: 20px;
            font-weight: lighter;
            color: #204d3a;
        
        }

        .knopka{
            background-color: #204d3a;
            padding: 30px ;
            color: #ffffff;
            width: 200px;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px;
            box-shadow: 1px 10px 40px 15px rgba(0, 0, 0, 0.350) ;
            
            
        }
        .green{
            display: flex;
            flex-direction: column;
            padding: 60px;
            width: 700px;
        }
        .woman { 
            display: flex;
            justify-content: center;          
            padding: 20px;
            width: 500px;
            height: 600px;
            background-color: #6BC785;
            border-top-right-radius: 45px;
            border-bottom-left-radius: 82px;
            border-bottom-right-radius: 150px;
            border-top-left-radius: 141px;
            

        }
        .landing {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: row;
            padding: 30px;
            gap: 200px;
        

        }
        @font-face {
	font-family: 'Elephant-Regular';
	src: url('../fonts/elephant-regular.eot'); /* IE 9 Compatibility Mode */
	src: url('../fonts/elephant-regular.eot?#iefix') format('embedded-opentype'), /* IE < 9 */
		url('../fonts/elephant-regular.woff2') format('woff2'), /* Super Modern Browsers */
		url('../fonts/elephant-regular.woff') format('woff'), /* Firefox >= 3.6, any other modern browser */
		url('../fonts/elephant-regular.ttf') format('truetype'), /* Safari, Android, iOS */
		url('../fonts/elephant-regular.svg#elephant-regular') format('svg'); /* Chrome < 4, Legacy iOS */
}
        .g1text {
            padding: 20px;
            display: flex;
            flex-wrap: wrap-reverse;
            font-size: 24px;
            font-weight: lighter;
            font-family: Arial, Helvetica, sans-serif;
            line-height: 45px;
            color: #2b855f;
            width: 500px;
            font-family: Poppins;
        }
        .sell1 {
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #224F34;
            font-family: Roboto slab;
            font-size: 45px;
            font-weight: bold;

        }
        .sell2 {
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #224F34;
            font-family: Poppins;
            font-size: 15px;
            font-weight: lighter;
        }
        .vtoraya{
            min-height: 100vh;
            padding: 40px;
        }
        


    </style>
</head>
<body>
    <section class="pervaia">
        <header>
            <h1 class="logo">Rivo</h1>
            <div class="con">
            <a href="#">HOME</a>
            <a href="#">SHOP</a>
            <a href="#">FEATURES</a>
            <a href="#">CONTACT</a>
            
            
        </div>
        <div class="kl">
        <img src="Vector.png" alt="">
        <button> LOGIN</button>
        </div>
    
        </header>
        <div class="landing">
        <div class="green">
        <h1 class="gtext">Discover and Find Your Own Fashion!</h1>
        <h2 class="g1text">Explore our curated collection of stylish clothing and accessories tailored to your unique taste.</h2>
        <button class="knopka">EXPLORE NOW</button>
        </div>
        <div class="woman">
            <img src="380f4d876a6e09212a48c77c3792e100104bc00e.png" alt="">
        </div>
        </div>
    </section>
    <section class="vtoraya">
        <div class="selling">
            <h1 class="sell1">Best selling</h1>
            <h2 class="sell2">Get in on the trend with our curated selection of best-selling styles.</h2>
        </div>
        <div class="woman1">
            <img src="c91277cf00d88a9d6f761d88c50e17e53587883c.png">
            <div class="opisanie1">Regular Fit Long Sleeve Top</div>
            <div class="price1">$38.99</div>
            <div class="palochka">|</div>
            <div class="rating1">5.0 ★</div>


        </div>
    </section>
        
   
    <main>
        

    </main>
    
    <footer></footer>
    
</body>
</html>
